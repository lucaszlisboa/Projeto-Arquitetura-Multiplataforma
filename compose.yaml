name: odontologia

services:
  dentist-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dentist_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DENTIST_DB_PORT:-5432}:5432"
    volumes:
      - dentist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentist_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  employee-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${EMPLOYEE_DB_PORT:-5434}:5432"
    volumes:
      - employee-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  patient-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patient_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${PATIENT_DB_PORT:-5437}:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${PAYMENT_DB_PORT:-5433}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "${KEYCLOAK_DB_PORT:-5435}:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in appointments payments health-insurance appointments.dlq payments.dlq health-insurance.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: odontologia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/keycloak/dentist-realm.json:/opt/keycloak/data/import/dentist-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  keycloak-ready:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        attempts=0
        until curl -fsS --max-time 2 http://keycloak:8080/realms/dentist/.well-known/openid-configuration >/dev/null; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 90 ]; then exit 1; fi
          sleep 2
        done
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  logs-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /app-logs && chown 1000:1000 /app-logs && chmod 775 /app-logs"]
    volumes:
      - app-logs:/app-logs
    restart: "no"

  dentist-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: dentist-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=dentist-db;Port=5432;Database=dentist_service;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      PaymentService__BaseUrl: ${PAYMENT_SERVICE_BASE_URL:-http://payment-service:5127}
      Kafka__BootstrapServers: kafka:19092
      Kafka__Enabled: "true"
      Observability__LogDirectory: /app/logs
    ports:
      - "${DENTIST_PORT:-5068}:5068"
    volumes:
      - app-logs:/app/logs
    depends_on:
      dentist-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  employee-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: employee-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=employee-db;Port=5432;Database=employee_service;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      DentistService__BaseUrl: http://dentist-service:5068
    ports:
      - "${EMPLOYEE_PORT:-5070}:5070"
    depends_on:
      employee-db:
        condition: service_healthy
      dentist-service:
        condition: service_healthy
    restart: unless-stopped

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: patient-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=patient-db;Port=5432;Database=patient_service;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${PATIENT_PORT:-5072}:5072"
    depends_on:
      patient-db:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: payment-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=payment-db;Port=5432;Database=payment_service;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Kafka__BootstrapServers: kafka:19092
      Kafka__Enabled: "true"
      Observability__LogDirectory: /app/logs
    ports:
      - "${PAYMENT_PORT:-5127}:5127"
    volumes:
      - app-logs:/app/logs
    depends_on:
      payment-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-service-wiremock:
    build:
      context: .
      dockerfile: Payment-Service/PaymentService.WireMock/Dockerfile
    profiles: [mock]
    environment:
      WIREMOCK_PORT: 5127
    ports:
      - "${PAYMENT_WIREMOCK_PORT:-5128}:5127"
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    environment:
      NODE_ENV: production
      PORT: 3000
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/dentist
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/dentist/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: dentist-app
      DENTIST_SERVICE_BASE_URL: http://dentist-service:5068
      EMPLOYEE_SERVICE_BASE_URL: http://employee-service:5070
      SWAGGER_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_DIR: /app/logs
    ports:
      - "${BFF_PORT:-3000}:3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
      dentist-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - dentist-service
      - payment-service
      - bff
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: [observability]
    command: ["--kafka.server=kafka:19092"]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    environment:
      cluster.name: odontologia-logs
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./elk/elasticsearch:/setup:ro
    command: ["bash", "/setup/setup.sh"]
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx256m}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    user: root
    depends_on:
      logstash:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/var/log/odonto:ro
      - filebeat-data:/usr/share/filebeat/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  kibana-setup:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    profiles: [elk]
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./elk/kibana:/setup:ro
    command: ["bash", "/setup/setup.sh"]
    restart: "no"

  dentist-service-mock:
    image: node:20-alpine
    profiles: [mock]
    working_dir: /mock
    volumes:
      - ./bff/test/support/downstream-mock.standalone.js:/mock/server.js:ro
    command: ["node", "/mock/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5068/api/dentist-services"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bff-mock:
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    profiles: [mock]
    environment:
      NODE_ENV: development
      PORT: 3000
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/dentist
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/dentist/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: dentist-app
      DENTIST_SERVICE_BASE_URL: http://dentist-service-mock:5068
      EMPLOYEE_SERVICE_BASE_URL: http://employee-service:5070
      SWAGGER_ENABLED: "true"
      LOG_DIR: /app/logs
    ports:
      - "${BFF_MOCK_PORT:-3002}:3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
      dentist-service-mock:
        condition: service_healthy
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dentist-db-data:
  employee-db-data:
  patient-db-data:
  payment-db-data:
  keycloak-db-data:
  kafka-data:
  app-logs:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  filebeat-data:
