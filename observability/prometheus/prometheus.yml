global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: odontologia

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # APIs e BFF rodam na rede Docker compartilhada pelo compose.yaml.
  - job_name: dentist-service
    metrics_path: /metrics
    static_configs:
      - targets: ["dentist-service:5068"]
        labels:
          service: dentist-service

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:5127"]
        labels:
          service: payment-service

  - job_name: bff
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:3000"]
        labels:
          service: bff

  # Métricas do broker Kafka (lag por grupo/tópico/partição).
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
