name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Dentist-Service/Dentist-service.sln

      - name: Build
        run: dotnet build Dentist-Service/Dentist-service.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Dentist-Service/Dentist-service.Tests/Dentist-service.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests
          path: test-results/*.trx
          reporter: dotnet-trx
