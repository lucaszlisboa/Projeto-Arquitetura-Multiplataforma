services:
  payment-service-wiremock:
    container_name: payment-service-wiremock
    build:
      context: ..
      dockerfile: Payment-Service/PaymentService.WireMock/Dockerfile
    ports:
      - "5128:5127"
    environment:
      WIREMOCK_PORT: 5127

  payment-service-db:
    container_name: payment-service-db
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_service
    ports:
      - "5433:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

volumes:
  payment_postgres_data:
